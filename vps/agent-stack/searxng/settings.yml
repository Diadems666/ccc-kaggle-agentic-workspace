# SearXNG for agent research. Reachable only from the docker bridge / loopback,
# so the bot limiter is off and JSON output is enabled for research/searx.py.
use_default_settings: true

general:
  instance_name: "CCC research"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  # secret_key is injected from the SEARXNG_SECRET environment variable.
  limiter: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
